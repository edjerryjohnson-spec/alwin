.wrap{max-width:480px;margin:0 auto;padding-block:36px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
.photo{width:148px;height:148px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);max-width:100%}
.name{font-family:var(--script);font-size:68px;line-height:1;margin:0;font-weight:400}
.alias{font-size:13px;letter-spacing:.42em;font-weight:700;color:var(--gold-ink);margin:6px 0 0;padding-left:.42em}
.rule{width:56px;height:1px;background:var(--gold);border:0;margin:0}
.role{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink);margin:0;padding-left:.3em}
.motto{font-family:var(--script);font-size:26px;color:var(--gold-ink);margin:0}
.links{width:100%;display:flex;flex-direction:column;gap:10px;text-align:left}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.row .info{flex:1;min-width:0}
.row .net{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.row .val{font-size:16px;font-weight:600;overflow-wrap:anywhere;user-select:all;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:6px;flex:none}
.open,.copy{font:inherit;font-size:13px;font-weight:700;border-radius:8px;padding:7px 11px;cursor:pointer;text-decoration:none;white-space:nowrap}
.open{background:var(--gold);color:var(--bg);border:1px solid var(--gold)}
.copy{background:transparent;color:var(--gold-ink);border:1px solid var(--line)}
.open:focus-visible,.copy:focus-visible{outline:2px solid var(--gold-ink);outline-offset:2px}
.foot{font-size:12px;color:var(--muted)}
@media (max-width:360px){.row{flex-wrap:wrap}.btns{width:100%}.open,.copy{flex:1;text-align:center}}
</style>
